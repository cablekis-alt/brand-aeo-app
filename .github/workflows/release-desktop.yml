name: Release desktop app

# 데스크톱 설치본(NSIS .exe + 포터블 zip + latest.yml)을 CI에서 빌드해 릴리스에 올린다.
#
# 왜 CI인가: 개발 PC에 Windows Smart App Control이 켜지면 NSIS 단계가 실패한다. NSIS는
# 설치본을 만들며 "방금 만든 미서명 uninstaller.exe"를 실행해야 하는데 SAC가 그 실행을
# 거부해 `spawn UNKNOWN`으로 죽는다(SAC는 한 번 끄면 Windows 재설치 전까지 다시 켤 수 없어
# 로컬에서 끄는 대신 러너에서 빌드한다). windows-latest 러너에는 SAC가 없다.
#
# 키: 이미 등록된 시크릿을 러너의 .env에 써서 scripts/prepare-bundled-env.mjs가 설치본에
# 굽는다 — 로컬 빌드와 동일한 동작이다. 설치본에 키가 들어가므로 내부 배포 전용이며,
# 저장소·릴리스가 private인 동안에만 유효한 전제다. 로그에는 키를 출력하지 않는다.
#
# 순서(2026-11-13부터 — 설치 파일을 다 올린 뒤 공개):
#   1) 버전 커밋을 master에 push  2) git tag vX.Y.Z && git push origin vX.Y.Z
#   3) gh release create vX.Y.Z --draft --verify-tag --title vX.Y.Z --notes-file <노트>
#   4) gh workflow run release-desktop.yml -f tag=vX.Y.Z  → 빌드 · 업로드 · 자산 확인 뒤 이 워크플로가 초안을 공개한다.
#   (-f publish=false로 돌려 초안으로 둔 것은 같은 명령을 publish 없이 다시 돌리면 다시 빌드하지 않고 공개만 한다.)
#   (자산 다섯 개가 다 붙어 있으면 빌드를 건너뛴다. 잘못된 빌드를 다시 만들려면 -f rebuild=true — 초안일 때만 쓴다. 공개된 릴리스를
#    다시 올리면 --clobber 사이에 자산이 잠깐 사라지므로, 공개 뒤에는 새 버전으로 고친다.)
# 예전에는 릴리스를 먼저 공개하고 그 이벤트로 빌드했다. 그러면 공개 뒤 몇 분 동안 latest.yml이 없어(v0.4.75: 공개 08:35:20Z,
# latest.yml 08:38:45Z) 그 사이 앱의 업데이트 확인이 ERR_UPDATER_CHANNEL_FILE_NOT_FOUND로 끝났다. 초안은 앱에 보이지 않는다.
# 공개 이벤트 경로(release: published)는 예비로 남긴다 — 이 워크플로가 GITHUB_TOKEN으로 공개하는 것은 새 실행을 만들지 않는다.

run-name: release ${{ inputs.tag || github.event.release.tag_name }}

on:
  # 예비: 릴리스를 바로 공개했으면 그 뒤에 빌드·업로드한다(공개 뒤 몇 분은 latest.yml이 없다).
  release:
    types: [published]
  # 주 경로: 초안 릴리스를 만든 뒤 태그를 지정해 돌린다. 실패한 빌드를 다시 돌릴 때도 쓴다.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and upload (e.g. v0.1.38)'
        required: true
        type: string
      publish:
        description: 'Publish the draft release after all assets are uploaded'
        required: false
        default: true
        type: boolean
      rebuild:
        description: 'Build and re-upload even if all five assets are already attached (e.g. a broken build)'
        required: false
        default: false
        type: boolean

concurrency:
  group: brand-aeo-release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # workflow_dispatch에서만 'true'/'false', 공개 이벤트 경로에서는 빈 값(이미 공개됨).
      PUBLISH: ${{ inputs.publish }}
      REBUILD: ${{ inputs.rebuild }}
    steps:
      # 빌드 전에 릴리스 · 태그가 있는지 본다 — 없으면 빌드(약 4분)를 하고 나서야 업로드에서 실패한다.
      # 초안이면 IS_DRAFT=true로 두고, 자산을 다 올린 뒤 아래 「Publish release」가 공개한다.
      # 자산 다섯 개가 이미 다 붙어 있으면 다시 빌드하지 않는다(SKIP_BUILD) — publish=false로 둔 초안을 웹에서 손으로 공개하면
      # 공개 이벤트 실행이 새로 생기는데, 그때 다시 빌드해 --clobber로 올리면 공개된 자산이 잠깐 사라지고(latest.yml 404) 초안에서
      # 시험한 파일과 다른 빌드로 바뀐다. 초안에 이미 다 있으면 공개만 한다.
      - name: Check release and tag
        shell: bash
        run: |
          if ! draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft); then
            echo "::error::$TAG 릴리스가 없습니다. 먼저 초안을 만드세요: gh release create $TAG --draft --verify-tag --title $TAG --notes-file <노트>"
            exit 1
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --silent; then
            echo "::error::태그 $TAG가 원격에 없습니다. 먼저 git tag $TAG && git push origin $TAG"
            exit 1
          fi
          ver="${TAG#v}"
          names=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          have=0
          for want in "Web4AI-Brand-AEO-${ver}-x64.exe" "Web4AI-Brand-AEO-${ver}-installer.zip" "Web4AI-Brand-AEO-${ver}-x64.zip" \
                      "Web4AI-Brand-AEO-${ver}-x64.exe.blockmap" "latest.yml"; do
            if grep -Fxq "$want" <<< "$names"; then have=$((have + 1)); fi
          done
          skip=false
          if [ "$have" -eq 5 ] && [ "$REBUILD" != "true" ]; then skip=true; fi
          echo "릴리스 $TAG — 초안: $draft · 자산 $have/5 · 다시 빌드 안 함: $skip · 공개 입력: ${PUBLISH:-(공개 이벤트)}"
          echo "IS_DRAFT=$draft" >> "$GITHUB_ENV"
          echo "SKIP_BUILD=$skip" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        if: env.SKIP_BUILD != 'true'
        with:
          # 릴리스 태그의 커밋을 그대로 빌드한다(master가 앞서 나가 있어도 태그 기준).
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        if: env.SKIP_BUILD != 'true'
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
        if: env.SKIP_BUILD != 'true'

      # package.json의 version과 태그가 어긋나면 latest.yml과 산출물 이름이 갈려
      # 자동 업데이트가 조용히 깨진다. 빌드 전에 막는다.
      - name: Check version matches tag
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          want="${TAG#v}"
          echo "package.json=$pkg  tag=$TAG"
          if [ "$pkg" != "$want" ]; then
            echo "::error::package.json 버전($pkg)과 태그($want)가 다릅니다."
            exit 1
          fi

      # prepare-bundled-env.mjs가 읽는 .env를 시크릿으로 만든다(값은 출력하지 않는다).
      - name: Write .env from secrets
        if: env.SKIP_BUILD != 'true'
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          TOURAPI_SERVICE_KEY: ${{ secrets.TOURAPI_SERVICE_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          # 설치본 기본 설정. 수집 엔진은 앱에서 바꿀 수 있으므로 기존과 같은 기본값을 굽는다.
          COLLECT_ENGINES: ${{ secrets.COLLECT_ENGINES || 'gemini' }}
          JUDGE_ENGINE: ${{ secrets.JUDGE_ENGINE || 'gemini' }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          : > .env
          for name in GEMINI_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY PERPLEXITY_API_KEY TOURAPI_SERVICE_KEY SERPAPI_API_KEY \
                      COLLECT_ENGINES JUDGE_ENGINE GA4_PROPERTY_ID GOOGLE_SERVICE_ACCOUNT_JSON; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s=%s\n' "$name" "$value" >> .env
              echo "  $name 설정됨"
            else
              echo "  $name 없음 — 건너뜀"
            fi
          done

      # --publish never: electron-builder의 자동 publish를 끈다. CI에서는 기본 정책이
      # 릴리스에 바로 올리려 해서, 아래 명시적 업로드 스텝과 이중으로 동작할 수 있다.
      - name: Build installer
        if: env.SKIP_BUILD != 'true'
        run: npm run electron:pack -- --publish never

      - name: List artifacts
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: ls -la dist-electron/out | grep -E "${TAG#v}" || true

      # electron-builder의 publisher를 쓰지 않고 직접 올린다 — 로컬 릴리스와 같은 자산 구성을
      # 유지하고(afterAllArtifactBuild가 만드는 installer.zip 포함), latest.yml을 확실히 넣는다.
      - name: Upload to release
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          ver="${TAG#v}"
          files=(
            "dist-electron/out/Web4AI-Brand-AEO-${ver}-x64.exe"
            "dist-electron/out/Web4AI-Brand-AEO-${ver}-installer.zip"
            "dist-electron/out/Web4AI-Brand-AEO-${ver}-x64.zip"
            "dist-electron/out/Web4AI-Brand-AEO-${ver}-x64.exe.blockmap"
            "dist-electron/out/latest.yml"
          )
          missing=0
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then echo "::error::산출물 없음: $f"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || exit 1
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          echo "업로드 완료: $TAG"

      # 공개하기 전에 릴리스에 자산 다섯 개가 다 붙었는지 다시 본다 — 하나라도 없으면 앱이 latest.yml을 찾지 못하거나 받다가 실패한다.
      - name: Check release assets
        shell: bash
        run: |
          ver="${TAG#v}"
          names=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          missing=0
          for want in "Web4AI-Brand-AEO-${ver}-x64.exe" "Web4AI-Brand-AEO-${ver}-installer.zip" "Web4AI-Brand-AEO-${ver}-x64.zip" \
                      "Web4AI-Brand-AEO-${ver}-x64.exe.blockmap" "latest.yml"; do
            if ! grep -Fxq "$want" <<< "$names"; then echo "::error::릴리스에 자산 없음: $want"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "자산 다섯 개 확인: $TAG"

      # 초안이면 이제 공개한다(publish 입력을 false로 주면 초안으로 둔다). 공개 이벤트 경로는 이미 공개돼 있다.
      - name: Publish release
        if: env.IS_DRAFT == 'true'
        shell: bash
        run: |
          if [ "$PUBLISH" = "false" ]; then
            echo "publish=false — 초안으로 둡니다: $TAG"
            exit 0
          fi
          gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
          echo "공개 완료: $TAG"

      # 키가 들어간 파일을 러너에 남기지 않는다(자산 업로드 실패 시에도 실행).
      - name: Remove secrets from runner
        if: always()
        shell: bash
        run: rm -f .env electron/build/bundled.env
