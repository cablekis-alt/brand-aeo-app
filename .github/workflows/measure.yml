name: Measure tenant

# Actions 등록 트리거용 (repo에서 Actions를 켠 뒤 재스캔 유도).

on:
  workflow_dispatch:
    inputs:
      tenantId:
        description: tenantId to measure (e.g. example-brand), or __queue__ to process the whole measure queue
        required: true
        type: string

concurrency:
  group: brand-aeo-measure
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      # 현재 OpenAI 크레딧이 없어 판정도 Gemini로 돌린다(secret로 덮어쓰기 가능).
      JUDGE_ENGINE: ${{ secrets.JUDGE_ENGINE || 'gemini' }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.7-flash' }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-4o' }}
      # Vercel Git 연동이 없으면(=CLI 배포) 아래 배포 스텝이 필요하다. 토큰 없으면 스킵.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Run pipeline and bake
        run: npx tsx scripts/ci-measure.ts "${{ inputs.tenantId }}"

      - name: Commit baked scores
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data server/liveRegistry.ts server/tenants.config.json
          if git diff --cached --quiet; then
            echo "baking 결과 변경 없음"
            exit 0
          fi
          MSG="data: measure ${{ inputs.tenantId }}"
          if [ "${{ inputs.tenantId }}" = "__queue__" ]; then MSG="data: measure queued brands"; fi
          git commit -m "$MSG"
          git pull --rebase origin "${{ github.ref_name }}"
          git push

      # Vercel Git 연동을 쓰면 위 push가 배포를 트리거하므로 이 스텝은 불필요(VERCEL_TOKEN 미설정 → 스킵).
      # 이 프로젝트처럼 CLI로 배포하는 경우엔 VERCEL_TOKEN/ORG/PROJECT secret을 넣어 여기서 배포한다.
      - name: Deploy to Vercel (CLI 배포용, 토큰 있을 때만)
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: npx vercel deploy --prod --yes --token="$VERCEL_TOKEN"
