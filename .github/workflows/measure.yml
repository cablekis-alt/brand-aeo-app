name: Measure tenant

on:
  workflow_dispatch:
    inputs:
      tenantId:
        description: tenantId to measure (e.g. example-brand)
        required: true
        type: string

concurrency:
  group: brand-aeo-measure
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Run pipeline and bake
        run: npx tsx scripts/ci-measure.ts "${{ inputs.tenantId }}"

      - name: Commit baked scores
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data server/liveRegistry.ts server/tenants.config.json
          if git diff --cached --quiet; then
            echo "baking 결과 변경 없음"
            exit 0
          fi
          git commit -m "data: measure ${{ inputs.tenantId }}"
          git pull --rebase origin "${{ github.ref_name }}"
          git push
