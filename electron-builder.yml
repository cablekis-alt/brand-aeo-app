# Web4AI Brand AEO 데스크톱 패키징 설정 (electron-builder)
appId: kr.o2o.web4ai.brandaeo
productName: Web4AI Brand AEO
copyright: © O2O

directories:
  output: dist-electron/out
  buildResources: electron/build

# 앱에 포함할 파일 — 프로덕션 node_modules는 electron-builder가 자동 포함한다.
files:
  - electron/**/*
  - dist/**/*
  - dist-electron/server.cjs
  - src/data/**/* # 첫 실행 시드 소스(커밋된 스코어카드·분석·질문은행)
  - package.json

asar: true

# 설치본 동봉 기본 API 키 — scripts/prepare-bundled-env.mjs가 빌드 머신 로컬 .env에서 생성.
# resources/bundled.env 로 복사되며, 패키징된 앱이 "기본 키"로 로드한다(사용자 .env가 있으면 우선).
# gitignore 되어 공개 소스에는 키가 없다.
extraResources:
  - from: electron/build/bundled.env
    to: bundled.env

# 빌드 후 NSIS 설치본(.exe)을 ZIP으로 감싼 "설치본 ZIP"을 자동 생성한다(.exe 다운로드 차단 우회용).
afterAllArtifactBuild: electron/after-all-artifact-build.cjs

# 자동 업데이트 소스 — app-update.yml에 임베드되어 electron-updater가 여기서 새 버전을 확인한다.
# 저장소가 private인 동안은 실제 다운로드에 토큰이 필요해 조용히 실패한다(공개 전환 시 바로 동작).
publish:
  provider: github
  owner: cablekis-alt
  repo: brand-aeo-app

# 앱 아이콘 — 512x512 PNG 하나면 electron-builder가 각 크기·.ico로 변환한다.
# buildResources(electron/build)에 icon.png가 있으면 자동 인식되지만 명시해 둔다.
icon: electron/build/icon.png

win:
  icon: electron/build/icon.png
  target:
    - nsis # 설치본(.exe)
    - zip # 포터블(압축본) — 압축 풀어 exe 실행, 설치 불필요
  # 파일명에 공백이 있으면 GitHub 업로드 시 "."으로 바뀌어 latest.yml(하이픈)과 불일치→자동업데이트
  # 다운로드 실패. 공백 없는 이름으로 고정해 on-disk·latest.yml·GitHub 에셋명을 모두 일치시킨다.
  artifactName: Web4AI-Brand-AEO-${version}-${arch}.${ext}
  # 코드 서명: 인증서를 저장소에 굽지 않는다. 아래 env가 있으면 electron-builder가 자동 서명한다.
  #   CSC_LINK=<.pfx 경로 또는 base64>  CSC_KEY_PASSWORD=<비밀번호>
  # env가 없으면 미서명 빌드(설치 시 SmartScreen 경고). 자세한 내용은 electron/README.md.

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
